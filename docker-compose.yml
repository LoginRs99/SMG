version: '3.8'

services:
  steamgifts-bot:
    build: .
    container_name: steamgifts-bot
    environment:
      - TZ=Europe/Budapest
      - CONFIG_PATH=/app/config/config.ini
      - LOGS_DIR=/app/logs
      - APP_DIR=/app
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
