version: '3.8'

services:
  smg-bot:
    image: ghcr.io/loginrs99/smg:latest
    build: .
    container_name: smg-bot
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Europe/Budapest}
      - LOGS_DIR=/app/logs
      - APP_DIR=/app
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/healthcheck.sh"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 5m
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
